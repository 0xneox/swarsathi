apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.swarsound'
version = '0.1.0'

android {
  namespace "expo.modules.swarsound"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  // TensorFlow Lite runtime for the bundled YAMNet model (Apache-2.0). The AAR ships the native
  // `libtensorflowlite_jni` for every Android ABI, so no NDK build step is required. YAMNet uses
  // only built-in operators, so no select-ops package is needed.
  //
  // Pinned to 2.16.1: 2.14.0 fails manifest merging on AGP 8+ because tensorflow-lite and
  // tensorflow-lite-api both declare the `org.tensorflow.lite` namespace.
  implementation 'org.tensorflow:tensorflow-lite:2.16.1'
}
